name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (render content + Tailwind CSS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets _site/assets

      - name: Inject Web3Forms access key
        env:
          # The key is public by nature (visible in the deployed form), so an
          # Actions *variable* is fine; a secret of the same name wins if set.
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY || vars.WEB3FORMS_ACCESS_KEY }}
        run: |
          if [ -z "$WEB3FORMS_ACCESS_KEY" ]; then
            echo "::warning::WEB3FORMS_ACCESS_KEY secret is not set — the deployed contact form will fall back to mailto."
          else
            sed -i "s/name=\"access_key\" value=\"\"/name=\"access_key\" value=\"$WEB3FORMS_ACCESS_KEY\"/" _site/index.html
            grep -q "name=\"access_key\" value=\"$WEB3FORMS_ACCESS_KEY\"" _site/index.html
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
