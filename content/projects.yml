# Curated repos: selection, order and fallback values. The build enriches
# these from the GitHub API (stars/forks/language/description/homepage/
# topics); on API failure the values below render as-is. Fallback stars must
# never exceed reality (constitution VI). Set `keep_description: true` on a
# repo to pin its curated description instead of the live GitHub one.
heading: Open source on GitHub
all_repos_url: https://github.com/thixpin?tab=repositories
status_note: Highlighted repositories
repos:
  - name: pitway
    badge: building
    description: >-
      The pit crew for agentic coding — control how AI coding agents plan,
      execute, verify and leave a traceable record of their work.
    language: TypeScript
    language_accent: true
    stars: 20
  - name: agentic-basic
    badge: most starred
    description: >-
      Agentic coding basics for junior developers — practical foundations
      for working with AI coding agents.
    language: Python
    stars: 63
  - name: md2book
    description: >-
      Turn a Markdown book manuscript into a print-ready PDF, EPUB 3 and web
      edition, with a QA pipeline.
    language: TypeScript
    stars: 3
  - name: claude-config
    description: >-
      A reusable Claude Code configuration for agentic coding and software
      engineering workflows.
    language: Shell
    stars: 8
  - name: Virama-JS
    description: >-
      Myanmar font detector and Zawgyi ⇄ Unicode auto-converter for the
      browser and Node.
    language: JavaScript
    stars: 7
  - name: Myanmar-UniPress
    description: >-
      Font detecting and converting plugin for Myanmar WordPress sites.
    language: PHP
    stars: 7

