  - title: Containers & Kubernetes
    description: >-
      Containerised services, orchestration and release workflows from a
      single host to multi-node clusters.
    tags: [Kubernetes, Docker, Linux]
  - title: Observability & SRE
    description: >-
      Metrics, logs and alerting that shorten incidents; availability,
      performance and capacity as engineering targets.
